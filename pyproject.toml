[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "copoe"
version = "0.1.0"
description = "Disease-coordinate product-of-experts fusion for missing-modality ADNI embeddings"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "Chihun An"},
  {name = "Ikbeom Jang"},
]
keywords = ["multimodal-learning", "missing-modalities", "product-of-experts", "alzheimer"]
dependencies = [
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "torch>=2.2",
]

[project.urls]
Repository = "https://github.com/labhai/CoPoE"
Issues = "https://github.com/labhai/CoPoE/issues"

[tool.setuptools.packages.find]
include = ["copoe*"]
